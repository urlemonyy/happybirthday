<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Unlock Access 💕</title>
  <style>
    :root {
      --pink-main: #ffb6c1;
      --pink-light: #ffe6f0;
      --pink-soft: #ffd6e0;
      --pink-bright: #ff8fab;
      --white: #fff8fa;
      --accent: #ffc1d6;
    }

    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, var(--pink-soft), var(--pink-light), var(--white));
      overflow: hidden;
    }

    .container {
      text-align: center;
      background: var(--white);
      padding: 40px 50px;
      border-radius: 25px;
      box-shadow: 0 8px 25px rgba(255, 182, 193, 0.4);
      animation: fadeIn 1.2s ease;
      max-width: 350px;
    }

    .lock {
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      background: url('https://cdn-icons-png.flaticon.com/512/3064/3064197.png') no-repeat center/contain;
      transition: transform 0.6s ease, background 0.5s ease;
    }

    .lock.open {
      background: url('https://cdn-icons-png.flaticon.com/512/3064/3064199.png') no-repeat center/contain;
      transform: rotate(-15deg) scale(1.05);
    }

    .lock.shake {
      animation: shake 0.4s ease;
    }

    h2 {
      color: var(--pink-bright);
      font-size: 1.5rem;
      margin-bottom: 15px;
    }

    input[type="password"] {
      padding: 12px 15px;
      border: 2px solid var(--accent);
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
      text-align: center;
      background: var(--pink-light);
      color: #444;
      transition: box-shadow 0.3s ease, border 0.3s ease;
    }

    input[type="password"]:focus {
      box-shadow: 0 0 10px rgba(255, 182, 193, 0.4);
      border-color: var(--pink-bright);
    }

    button {
      display: block;
      margin: 25px auto 10px;
      padding: 12px 30px;
      font-size: 1rem;
      border: none;
      border-radius: 25px;
      background: var(--pink-bright);
      color: white;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(255, 143, 171, 0.4);
    }

    button:hover {
      background: var(--accent);
      transform: translateY(-3px);
    }

    .message {
      font-size: 0.95rem;
      color: #666;
      margin-top: 15px;
      min-height: 20px;
      transition: color 0.3s ease;
    }

    footer {
      position: absolute;
      bottom: 10px;
      font-size: 0.8rem;
      color: #aaa;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      50% { transform: translateX(8px); }
      75% { transform: translateX(-8px); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="lock" id="lock"></div>
    <h2>💗 Enter PIN to Unlock 💗</h2>
    <input type="password" id="pin" maxlength="4" placeholder="****">
    <button onclick="checkPin()">Unlock 🔓</button>
    <div class="message" id="message"></div>
  </div>

  <footer>© 2025 Cute Access | Made with 💕</footer>

  <script>
    function checkPin() {
      const lock = document.getElementById('lock');
      const message = document.getElementById('message');
      const pin = document.getElementById('pin').value.trim();

      if (pin === "1910") {
        lock.classList.add('open');
        message.style.color = "#ff8fab";
        message.textContent = "✨ Unlocked! Redirecting...";
        setTimeout(() => {
          window.location.href = "index.html";
        }, 1500);
      } else {
        lock.classList.remove('open');
        lock.classList.add('shake');
        message.style.color = "#ff4b77";
        message.textContent = "❌ Incorrect PIN. Try again!";
        setTimeout(() => lock.classList.remove('shake'), 400);
      }
    }
  </script>
</body>
</html>
